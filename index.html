<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Axel Jamal, design engineer in Brighton & Hove and founder of Windfall at Marea Dvīpa. Dua Pulau is the portfolio as a world: sail a pinisi between two islands and moor at each project. Built in code with Three.js."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <title>Axel Jamal · Dua Pulau, a portfolio you sail</title>
    <link rel="canonical" href="https://axelle.marea-dvipa.uk/" />
    <script>
      // links made before Dua Pulau was the home page point at sections of the classic portfolio: send them on
      var onward = function () {
        if (/^#(work|about|contact|skills|top|home)$/.test(location.hash)) location.replace("/portfolio/" + location.hash);
      };
      onward();
      addEventListener("hashchange", onward);
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dua-pulau/main.tsx"></script>
  </body>
</html>
