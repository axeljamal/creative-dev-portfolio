<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#0e0c09" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Axel Jamal: design engineer and AI creative technologist in Brighton. Case studies in React, Vue, accessibility and AI-assisted product development."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <title>Axel Jamal · Design Engineer</title>
    <script>
      // apply a saved Light/Dark choice before first paint (src/theme.ts manages it after)
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
