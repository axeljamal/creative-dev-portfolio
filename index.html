<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7ec" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#140c06" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Axel Jamal: design engineer and AI creative technologist in Brighton. Case studies in React, Vue, accessibility and AI-assisted product development."
    />
    <link rel="icon" href="/favicon.ico" />
    <title>Axel Jamal · Design Engineer</title>
    <script>
      // apply a saved Light/Dark choice before first paint (src/theme.ts manages it after)
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
