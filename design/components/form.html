<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Contact form · Creative Dev Portfolio</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../glass.css" />
    <link rel="stylesheet" href="../preview.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="page-title">Components</p>
    <h1 class="page-heading">Contact form</h1>
    <form class="glass-strong" style="max-width:520px;border-radius:2rem;padding:28px;display:grid;gap:16px" onsubmit="return false">
      <label class="field-label">Name<input class="glass-field" placeholder="Ada Lovelace" /></label>
      <label class="field-label">Email<input class="glass-field" type="email" placeholder="ada@example.com" /></label>
      <label class="field-label">Message<textarea class="glass-field" rows="4"></textarea></label>
      <div><button class="btn btn-primary" type="submit"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></svg> Send message</button></div>
    </form>
  </body>
</html>
