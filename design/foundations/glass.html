<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Liquid Glass · Creative Dev Portfolio</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../glass.css" />
    <link rel="stylesheet" href="../preview.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="page-title">Foundations</p>
    <h1 class="page-heading">Liquid Glass</h1>
    <p class="label">Three strengths over the same backdrop. On the site, Chromium adds edge refraction; all three turn solid with Reduce transparency or Increase contrast.</p>
    <div style="position:relative;border-radius:2.5rem;overflow:hidden;padding:28px;background:
      radial-gradient(circle at 20% 30%, var(--leaf) 0 18%, transparent 19%),
      radial-gradient(circle at 75% 60%, var(--sun) 0 22%, transparent 23%),
      linear-gradient(120deg, var(--accent), #c75a00)">
      <div class="row" style="gap:16px;align-items:stretch">
        <div class="glass-clear" style="flex:1;min-width:160px;border-radius:1.75rem;padding:20px">
          <strong>Clear</strong><p class="card-meta">Controls over imagery. 6px blur.</p>
        </div>
        <div class="glass" style="flex:1;min-width:160px;border-radius:1.75rem;padding:20px">
          <strong>Regular</strong><p class="card-meta">Bars and tiles. 18px blur.</p>
        </div>
        <div class="glass-strong" style="flex:1;min-width:160px;border-radius:1.75rem;padding:20px">
          <strong>Strong</strong><p class="card-meta">Text-heavy cards. 28px blur.</p>
        </div>
      </div>
    </div>
  </body>
</html>
