<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Spacing and radius · Creative Dev Portfolio</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../glass.css" />
    <link rel="stylesheet" href="../preview.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="page-title">Foundations</p>
    <h1 class="page-heading">Spacing and radius</h1>
    <div class="stack">
      <div>
        <p class="label">Corner radius: concentric, inner corners smaller than the surface they sit in</p>
        <div class="row" style="gap:20px;align-items:flex-start">
        <div style="text-align:center">
          <div class="glass" style="width:88px;height:88px;border-radius:9999px"></div>
          <p class="swatch-name">Pill</p><p class="swatch-var">9999px</p>
        </div>
        <div style="text-align:center">
          <div class="glass" style="width:88px;height:88px;border-radius:2.5rem"></div>
          <p class="swatch-name">Card large</p><p class="swatch-var">2.5rem</p>
        </div>
        <div style="text-align:center">
          <div class="glass" style="width:88px;height:88px;border-radius:2rem"></div>
          <p class="swatch-name">Card</p><p class="swatch-var">2rem</p>
        </div>
        <div style="text-align:center">
          <div class="glass" style="width:88px;height:88px;border-radius:1.75rem"></div>
          <p class="swatch-name">Tile</p><p class="swatch-var">1.75rem</p>
        </div>
        <div style="text-align:center">
          <div class="glass" style="width:88px;height:88px;border-radius:1.5rem"></div>
          <p class="swatch-name">Media</p><p class="swatch-var">1.5rem</p>
        </div>
        <div style="text-align:center">
          <div class="glass" style="width:88px;height:88px;border-radius:1.25rem"></div>
          <p class="swatch-name">Thumb</p><p class="swatch-var">1.25rem</p>
        </div>
        <div style="text-align:center">
          <div class="glass" style="width:88px;height:88px;border-radius:1rem"></div>
          <p class="swatch-name">Field</p><p class="swatch-var">1rem</p>
        </div>
        </div>
      </div>
      <div>
        <p class="label">Spacing: 4px base</p>
        <div class="stack" style="gap:8px">
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">4px</span><div style="height:12px;width:12px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">8px</span><div style="height:12px;width:24px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">12px</span><div style="height:12px;width:36px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">16px</span><div style="height:12px;width:48px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">24px</span><div style="height:12px;width:72px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">32px</span><div style="height:12px;width:96px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">40px</span><div style="height:12px;width:120px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">64px</span><div style="height:12px;width:192px;border-radius:9999px;background:var(--accent)"></div></div>
          <div class="row" style="gap:16px"><span class="swatch-var" style="width:48px">96px</span><div style="height:12px;width:288px;border-radius:9999px;background:var(--accent)"></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
