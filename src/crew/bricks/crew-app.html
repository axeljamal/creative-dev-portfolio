<template>
  <header>
    <a class="mark" href="#/">
      <span class="kicker">Pinisi Yard</span>
      <span class="name">The Crew</span>
    </a>
    <nav aria-label="The Crew">
      <a href="#/" :aria-current="this.here('home')">Home</a>
      <a href="#/deck" :aria-current="this.here('deck')">Deck</a>
      <a href="#/playtest" :aria-current="this.here('playtest')">Playtest</a>
      <a href="#/team" :aria-current="this.here('team')">Team</a>
    </nav>
  </header>
  <main>
    <crew-home :if="state.route === 'home'"></crew-home>
    <crew-deck :if="state.route === 'deck'"></crew-deck>
    <crew-playtest :if="state.route === 'playtest'"></crew-playtest>
    <crew-team :if="state.route === 'team'"></crew-team>
  </main>
  <footer>
    <nav class="play" aria-label="Play">
      <a href="/yard/">Build a boat</a>
      <a href="/bricks/race/">Race her</a>
      <a href="/bricks/">Sail Dua Pulau in bricks</a>
    </nav>
    <p>The Crew is the players' community for <a href="/yard/">Pinisi Yard</a>, a boat-building game I am making in the
      <a href="/bricks/">Dua Pulau</a> world. Built with <a href="https://lego.js.org" rel="noopener">LEGO.js</a> web components
      on Cloudflare. Members are 18+. Rows marked <b>demo</b> are made up, to show the tools before real players arrive.
      Plain studs, generic bricks: not affiliated with any toy maker.</p>
  </footer>
</template>

<script>
  import { load } from "../store.js";

  const ROUTES = ["home", "deck", "playtest", "team"];
  const routeOf = () => {
    const r = location.hash.replace(/^#\/?/, "").split("/")[0];
    return ROUTES.includes(r) ? r : "home";
  };

  export default class extends Lego {
    state = { route: routeOf() };

    init() {
      this.onHash = () => {
        this.render({ route: routeOf() });
        window.scrollTo({ top: 0 });
      };
    }
    connected() {
      window.addEventListener("hashchange", this.onHash);
      load();
    }
    disconnected() {
      window.removeEventListener("hashchange", this.onHash);
    }
    here(route) {
      return this.state.route === route ? "page" : null;
    }
  }
</script>
