<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0055bf" />
    <meta name="description" content="The Crew: the founding players of Pinisi Yard, a boat-building game in the making. Playtest each build first." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Crew · Pinisi Yard" />
    <meta property="og:description" content="Build the first boats. Shape the game." />
    <meta property="og:url" content="https://axelle.marea-dvipa.uk/crew/" />
    <title>The Crew · Pinisi Yard</title>
    <link rel="canonical" href="https://axelle.marea-dvipa.uk/crew/" />
    <style>
      /* The Crew in the brick world's colours: toy signage over a bright sky. Custom properties inherit into every
         brick's shadow root. --pearl is the text colour and --gold the yellow of what you press. */
      :root {
        --ink: #1b1b1b;
        --pearl: #1b1b1b;
        --pearl-soft: #45505e;
        --gold: #ffcf00;
        --gold-deep: #f2b700;
        --blue: #0055bf;
        --red: #c91a09;
        --sea: #00852b;
        --coral: #c91a09;
        --glass: #ffffff;
        --mist: #eef3f8;
        --line: #1b1b1b;
        --line-strong: #1b1b1b;
        --edge: 3px solid #1b1b1b;
        --serif: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif;
        --sans: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif;
        --mono: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif;
        --gut: max(20px, env(safe-area-inset-left), env(safe-area-inset-right));
        color-scheme: light;
      }
      html, body { margin: 0; color: var(--pearl); font-family: var(--sans); }
      html { background: #e9f5fd; }
      body {
        /* the brick world's sky */
        background: linear-gradient(#9fd0f5, #cfe8fa 55%, #e9f5fd);
        background-attachment: fixed;
        min-height: 100vh;
      }
      crew-app:not(:defined) { display: block; padding: 40px 20px; font: 600 15px var(--sans); color: var(--pearl-soft); }
      crew-app:not(:defined)::before { content: "Opening the yard…"; }
    </style>
  </head>
  <body>
    <crew-app></crew-app>
    <noscript><p style="padding: 20px">The Crew needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/crew/main.js"></script>
  </body>
</html>
