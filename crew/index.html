<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="description" content="The Crew: the founding players of Pinisi Yard, a boat-building game in the making. Playtest each build first." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Crew · Pinisi Yard" />
    <meta property="og:description" content="Build the first boats. Shape the game." />
    <meta property="og:url" content="https://axelle.marea-dvipa.uk/crew/" />
    <title>The Crew · Pinisi Yard</title>
    <link rel="canonical" href="https://axelle.marea-dvipa.uk/crew/" />
    <style>
      /* Dua Pulau's night palette; custom properties inherit into every brick's shadow root */
      :root {
        --ink: #0e0c09;
        --pearl: #f4eee3;
        --pearl-soft: rgba(244, 238, 227, 0.72);
        --gold: #e0c27e;
        --gold-deep: #c39b65;
        --sea: #7fc8b4;
        --coral: #f2a08a;
        --glass: rgba(244, 238, 227, 0.04);
        --line: rgba(224, 194, 126, 0.22);
        --line-strong: rgba(244, 238, 227, 0.28);
        --serif: "Cormorant Garamond", Georgia, serif;
        --sans: "Karla", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --gut: max(20px, env(safe-area-inset-left), env(safe-area-inset-right));
        color-scheme: dark;
      }
      html, body { margin: 0; background: #070a12; color: var(--pearl); font-family: var(--sans); }
      body {
        background:
          radial-gradient(1200px 600px at 80% -10%, rgba(224, 194, 126, 0.1), transparent 60%),
          radial-gradient(900px 500px at -10% 30%, rgba(127, 200, 180, 0.06), transparent 60%),
          #070a12;
        min-height: 100vh;
      }
      crew-app:not(:defined) { display: block; padding: 40px 20px; font: 500 14px var(--mono); color: var(--pearl-soft); }
      crew-app:not(:defined)::before { content: "Opening the yard…"; }
    </style>
  </head>
  <body>
    <crew-app></crew-app>
    <noscript><p style="padding: 20px">The Crew needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/crew/main.js"></script>
  </body>
</html>
